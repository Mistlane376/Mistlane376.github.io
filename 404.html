<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#15242a">
  <meta name="description" content="你访问的页面不存在，返回 Mistlane's Blog 继续浏览。">
  <title>页面未找到 | Mistlane's Blog</title>
  <link rel="icon" href="/images/favicon.png">
  <style>
    :root {
      color-scheme: dark;
      --ink: #ffffff;
      --muted: rgba(255, 255, 255, 0.76);
      --border: rgba(255, 255, 255, 0.25);
      --surface: rgba(18, 35, 42, 0.54);
      --surface-hover: rgba(255, 255, 255, 0.14);
      --teal: #77d1c8;
      --coral: #f0a093;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
      margin: 0;
    }

    body {
      min-height: 100vh;
      min-height: 100svh;
      background: #15242a url('/images/selection1.jpg') center / cover no-repeat fixed;
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif;
      letter-spacing: 0;
    }

    body::before {
      position: fixed;
      inset: 0;
      background: rgba(12, 28, 35, 0.66);
      content: '';
    }

    .page-shell {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-rows: auto 1fr auto;
      width: min(1180px, calc(100% - 48px));
      min-height: 100vh;
      min-height: 100svh;
      margin: 0 auto;
    }

    .site-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 76px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.16);
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 11px;
      color: #fff;
      font-size: 0.98rem;
      font-weight: 700;
      text-decoration: none;
    }

    .brand img {
      width: 32px;
      height: 32px;
      border: 1px solid rgba(255, 255, 255, 0.28);
      border-radius: 6px;
      object-fit: cover;
    }

    .header-link {
      color: var(--muted);
      font-size: 0.9rem;
      text-decoration: none;
    }

    .header-link:hover {
      color: #fff;
    }

    main {
      display: flex;
      align-items: center;
      padding: 56px 0;
    }

    .error-content {
      max-width: 720px;
    }

    .error-code {
      margin: 0 0 18px;
      color: var(--teal);
      font-size: clamp(5rem, 14vw, 9rem);
      font-weight: 800;
      line-height: 0.88;
    }

    h1 {
      max-width: 680px;
      margin: 0;
      color: #fff;
      font-size: clamp(2rem, 5vw, 4rem);
      font-weight: 760;
      line-height: 1.2;
    }

    .description {
      max-width: 590px;
      margin: 24px 0 0;
      color: var(--muted);
      font-size: 1.04rem;
      line-height: 1.8;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 34px;
    }

    .action {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      padding: 0 18px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--surface);
      color: #fff;
      font: inherit;
      font-size: 0.92rem;
      font-weight: 650;
      text-decoration: none;
      cursor: pointer;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      transition: background 0.2s ease, border-color 0.2s ease, transform 0.2s ease;
    }

    .action:hover {
      border-color: rgba(255, 255, 255, 0.42);
      background: var(--surface-hover);
      transform: translateY(-2px);
    }

    .action-primary {
      border-color: transparent;
      background: var(--teal);
      color: #10262a;
    }

    .action-primary:hover {
      border-color: transparent;
      background: #91ded6;
    }

    .route-list {
      display: flex;
      flex-wrap: wrap;
      gap: 10px 22px;
      margin-top: 30px;
    }

    .route-list a {
      border-bottom: 1px solid transparent;
      color: var(--muted);
      font-size: 0.9rem;
      text-decoration: none;
    }

    .route-list a::before {
      margin-right: 7px;
      color: var(--coral);
      content: '/';
      font-weight: 800;
    }

    .route-list a:hover {
      border-bottom-color: var(--teal);
      color: #fff;
    }

    footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      min-height: 68px;
      border-top: 1px solid rgba(255, 255, 255, 0.16);
      color: rgba(255, 255, 255, 0.56);
      font-size: 0.78rem;
    }

    footer a {
      color: rgba(255, 255, 255, 0.72);
      text-decoration: none;
    }

    @media (max-width: 640px) {
      .page-shell {
        width: min(100% - 32px, 1180px);
      }

      .site-header {
        min-height: 66px;
      }

      .brand span {
        display: none;
      }

      main {
        align-items: flex-start;
        padding: 58px 0 46px;
      }

      .description {
        margin-top: 18px;
        font-size: 0.96rem;
      }

      .actions {
        align-items: stretch;
        flex-direction: column;
        margin-top: 28px;
      }

      .action {
        width: 100%;
      }

      .route-list {
        gap: 12px 18px;
      }

      footer {
        align-items: flex-start;
        flex-direction: column;
        justify-content: center;
        padding: 16px 0;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <div class="page-shell">
    <header class="site-header">
      <a class="brand" href="/">
        <img src="/images/favicon.png" alt="">
        <span>Mistlane's Blog</span>
      </a>
      <a class="header-link" href="/">返回首页</a>
    </header>

    <main>
      <section class="error-content" aria-labelledby="error-title">
        <p class="error-code" aria-hidden="true">404</p>
        <h1 id="error-title">这条路暂时没有通向任何页面</h1>
        <p class="description">
          链接可能已经迁移、名称发生了变化，或者只是输入时拐错了方向。你可以返回上一页，也可以从博客的主要入口继续探索。
        </p>

        <div class="actions">
          <a class="action action-primary" href="/">返回首页</a>
          <button class="action" type="button" id="back-button">返回上页</button>
        </div>

        <nav class="route-list" aria-label="博客主要入口">
          <a href="/archive/">归档</a>
          <a href="/album/">相册</a>
          <a href="/about/">关于</a>
        </nav>
      </section>
    </main>

    <footer>
      <span>&copy; 2025-2026 Mistlane</span>
      <a href="https://github.com/Mistlane376" rel="noopener" target="_blank">GitHub</a>
    </footer>
  </div>

  <script>
    document.getElementById('back-button').addEventListener('click', function () {
      if (window.history.length > 1) window.history.back()
      else window.location.href = '/'
    })
  </script>
</body>
</html>
