# --------------------------------------
# Mistlane Theme Configuration
# Based on Butterfly 5.6.1. See themes/mistlane/UPSTREAM.md for attribution.
# If you have any questions, please refer to the documentation
# Chinese: https://butterfly.js.org/
# English: https://butterfly.js.org/en/
# --------------------------------------

# --------------------------------------
# Navigation Settings
# --------------------------------------

nav:
  # Navigation bar logo image
  logo: /images/favicon.png
  display_title: true
  display_post_title: true
  # Whether to fix navigation bar
  fixed: false

# Local theme identity shown by the shared footer template.
mistlane:
  name: Mistlane
  url: /about/
  upstream: Butterfly 5.6.1

menu:
  Projects: /projects/ || fas fa-folder-tree
  首页: / || fas fa-home
  归档: /archive/ || fas fa-box-archive
  相册: /album/ || fas fa-images
  探索 || fas fa-compass:
    追番: /bangumis/ || fas fa-play-circle
    友链: /link/ || fas fa-link
    留言板: /guestbook/ || fas fa-pen-to-square
  关于: /about/ || fas fa-user

# --------------------------------------
# Code Blocks Settings
# --------------------------------------

code_blocks:
  # Code block theme: darker / pale night / light / ocean / false
  theme: light
  macStyle: false
  # Code block height limit (unit: px)
  height_limit: false
  word_wrap: false

  # Toolbar
  copy: true
  language: true
  # true: shrink the code blocks | false: expand the code blocks | none: expand code blocks and hide the button
  shrink: false
  fullpage: false

# Social media links
# Formal:
#   icon: link || the description || color
social:
  fab fa-github: https://github.com/Mistlane376 || Github || '#24292e'
  fab fa-qq: /images/QQ.jpg || QQ || '#12b7f5'
  fab fa-weixin: /images/weixin.jpg || 微信 || '#07c160'
  fab fa-tiktok: /images/douyin.jpg || 抖音 || '#000000'
  fas fa-play: https://space.bilibili.com/1146476510 || B站 || '#fb7299'
  fas fa-code: https://blog.csdn.net/ljl37 || CSDN || '#fc5531'

# --------------------------------------
# Image Settings
# --------------------------------------

favicon: /images/favicon.png

avatar:
  img: /images/marcus.png
  effect: false

# 禁用所有横幅图片
disable_top_img: false

# 如果页面未设置横幅，则显示默认顶部图
default_top_img: /images/selection1.jpg

# 首页的横幅图片
index_img: /images/selection1.jpg

# 归档页的横幅图片
archive_img: false

# 注意：这是单个标签页，不是标签总览页
tag_img: false

# 可以为每个标签单独设置横幅图片
# 格式：
#  - 标签名称: xxxxx
tag_per_img:
  博客: /images/selection1.jpg
  Markdown: /images/selection1.jpg
  C/C++: /images/selection2.jpg
  项目: /images/selection2.jpg
  总结: /images/selection1.jpg
  大学: /images/selection1.jpg
  生活: /images/selection1.jpg

# 注意：这是单个分类页，不是分类总览页
category_img: true

# 可以为每个分类单独设置横幅图片
# 格式：
#  - 分类名称: xxxxx
category_per_img:
  日常: /images/selection1.jpg
  教程: /images/selection1.jpg
  项目练习: /images/selection2.jpg
  算法模板: /images/selection2.jpg
  题解: /images/Bamboo.jpg

  # If set to false, no image will be shown
footer_img: false

# 网站背景
# 可设为颜色值、图片 URL，或包含颜色/图片 URL 的数组
# 若设为数组，每次加载时会随机选择其中一项作为背景
background: '#f2f5f4'
cover:
  # 是否启用封面图
  index_enable: true
  aside_enable: true
  archives_enable: false
  # 当文章未设置封面时，显示的默认封面
  default_cover:  /images/selection1.jpg
    # - xxx.jpg

# 图片加载失败时的替代图片
error_img:
  flink: /img/friend_404.gif
  post_page: /img/404.jpg
# A simple 404 page
post_meta:
  # Home Page
  page:
    # Choose: created / updated / both
    date_type: created
    # Choose: date / relative
    date_format: date
    categories: true
    tags: false
    label: true
  post:
    # Choose: left / center
    position: left
    # Choose: created / updated / both
    date_type: both
    # Choose: date / relative
    date_format: date
    categories: true
    tags: true
    label: true

# --------------------------------------
# Index page settings
# --------------------------------------

# The top_img settings of home page
# default: top img - full screen, site info - middle
# The position of site info, eg: 300px/300em/300rem/10%
index_site_info_top:
# The height of top_img, eg: 300px/300em/300rem
index_top_img_height:

# The subtitle on homepage
subtitle:
  enable: true
  # Typewriter Effect
  effect: true
  loop: true
  # Source - Call the third-party service API (Chinese only)
  # It will show the source first, then show the content of sub
  # Choose: false/1/2/3
  # false - disable the function
  # 1 - hitokoto.cn
  # 2 - https://api.aa1.cn/doc/yiyan.html
  # 3 - jinrishici.com
  source: false
  # If you close the typewriter effect, the subtitle will only show the first line of sub
  sub:
    - '<i class="fas fa-quote-left"></i> 我愿意面对孤独与恐惧，而不是慌忙寻找慰藉。 —— 迈克尔·阿伦·辛格'
    - '<i class="fas fa-quote-left"></i> 我们的夏日翩然逃逸，进入了美之地。 —— 艾米莉·狄金森'
    - '<i class="fas fa-quote-left"></i> 阳光灼热，数不尽夏日繁华；蝉鸣幽幽，道不完苦辣酸甜。 —— 危险同居人'
    - '<i class="fas fa-quote-left"></i> 你与自己的关系，会奠定下你与其他所有关系的基石。 —— 罗伯特·霍尔登'
    - '<i class="fas fa-quote-left"></i> 荒原之上，我既是行走者，也是自己的篝火。'
    - '<i class="fas fa-quote-left"></i> 不要温顺地走进那个良夜，怒斥，怒斥光明的消逝。 —— 迪伦·托马斯'
    - '<i class="fas fa-quote-left"></i> 我心中有片花海，不为谁开，只为风来。'
    - '<i class="fas fa-quote-left"></i> 真正的高贵，是优于过去的自己。 —— 海明威'
    - '<i class="fas fa-quote-left"></i> 允许一切发生，如其所是。'
    - '<i class="fas fa-quote-left"></i> 做你自己，因为别人都有人做了。 —— 王尔德'
    - '<i class="fas fa-quote-left"></i> 去成为你本可以成为的人，任何时候都不算晚。'
    - '<i class="fas fa-quote-left"></i> 万物皆有裂痕，那是光照进来的地方。 —— 莱昂纳德·科恩'

# Article layout on the homepage
# 1: Cover on the left, info on the right
# 2: Cover on the right, info on the left
# 3: Cover and info alternate between left and right
# 4: Cover on top, info on the bottom
# 5: Info displayed on the cover
# 6: Masonry layout - Cover on top, info on the bottom
# 7: Masonry layout - Info displayed on the cover
index_layout: 1

# Display the article introduction on homepage
# 1: description
# 2: both (if the description exists, it will show description, or show the auto_excerpt)
# 3: auto_excerpt (default)
# false: do not show the article introduction
index_post_content:
  method: 2
  # If you set method to 2 or 3, the length need to config
  length: 120

# --------------------------------------
# Post Settings
# --------------------------------------

toc:
  post: true
  page: true
  number: true
  expand: false
  # Only for post
  style_simple: false
  scroll_percent: true

post_copyright:
  enable: true
  decode: false
  author_href: https://github.com/Mistlane376
  license: CC BY-NC-SA 4.0
  license_url: https://creativecommons.org/licenses/by-nc-sa/4.0/

# Related Articles
related_post:
  enable: true
  # Number of posts displayed
  limit: 6
  # Choose: created / updated
  date_type: created

# Choose: 1 / 2 / false
# 1: The 'next post' will link to old post
# 2: The 'next post' will link to new post
# false: disable pagination
post_pagination: 1

# --------------------------------------
# Footer Settings
# --------------------------------------
footer:
  nav:
  owner:
    enable: true
    since: 2025
  # Copyright of theme and framework
  copyright:
    enable: true
    version: true
  custom_text: |
    <div class="footer-main">
      <section class="footer-intro" aria-label="站点信息">
        <a class="footer-brand" href="/">Mistlane's Blog</a>
        <p>记录代码、学习与日常中值得回看的片段。</p>
      </section>
      <nav class="footer-nav" aria-label="页脚导航">
        <a href="/">首页</a>
        <a href="/archive/">归档</a>
        <a href="/about/">关于</a>
      </nav>
      <div class="footer-social" aria-label="社交链接">
        <a href="https://github.com/Mistlane376" target="_blank" rel="noopener" title="GitHub" aria-label="GitHub"><i class="fab fa-github"></i></a>
        <a href="https://space.bilibili.com/1146476510" target="_blank" rel="noopener" title="B站" aria-label="B站"><i class="fas fa-play"></i></a>
        <a href="/images/QQ.jpg" target="_blank" title="QQ" aria-label="QQ"><i class="fab fa-qq"></i></a>
        <a href="/images/weixin.jpg" target="_blank" title="微信" aria-label="微信"><i class="fab fa-weixin"></i></a>
        <a href="https://blog.csdn.net/ljl37" target="_blank" rel="noopener" title="CSDN" aria-label="CSDN"><i class="fas fa-code"></i></a>
      </div>
      <a class="footer-record" href="https://icp.gov.moe/?keyword=20263737" target="_blank" rel="noopener">萌ICP备20263737号</a>
    </div>

# --------------------------------------
# Aside Settings
# --------------------------------------

aside:
  enable: true
  hide: false
  # 显示侧边栏隐藏按钮
  button: true
  # 按钮位置：在侧边栏内部（更明显）
  button_position: aside
  # 移动端显示
  mobile: false
  # 侧边栏位置：left / right
  position: right
  # 侧边栏显示内容
  display:
    # 归档
    archive: false
    # 标签
    tag: false
    # 分类
    category: false
    # 最近文章
    recent_posts: false
    # 文章目录
    toc: true
  # 个人卡片设置
  card_author:
    enable: true
    description: |
      齐鲁工业大学 · 计算机科学与技术 | 算法竞赛选手 (ACMer)

      <div class="author-tags">
        <span class="author-tag">#C++</span>
        <span class="author-tag">#算法竞赛</span>
        <span class="author-tag">#数据结构</span>
      </div>
    button:
      enable: true
      icon: fas fa-user-astronaut
      text: 了解更多
      link: /about
  # 公告卡片
  card_announcement:
    enable: true
    content: 欢迎来到 Mistlane's Blog，愿这里的记录对你有所帮助。
  card_recent_post:
    enable: false
  card_categories:
    enable: false
  card_tags:
    enable: false
  card_archives:
    enable: false
  card_post_series:
    enable: true
    # The title shows the series name
    series_title: false
    # Order by title or date
    orderBy: 'date'
    # Sort of order. 1, asc for ascending; -1, desc for descending
    order: -1
  card_webinfo:
    enable: true

# --------------------------------------
# Bottom right button
# --------------------------------------

# The distance between the bottom right button and the bottom (default unit: px)
rightside_bottom:

# Read Mode
readmode: true

# Dark Mode
darkmode:
  enable: true
  # Toggle Button to switch dark/light mode
  button: true
  # Switch dark/light mode automatically
  # autoChangeMode: 1  Following System Settings, if the system doesn't support dark mode, it will switch dark mode between 6 pm to 6 am
  # autoChangeMode: 2  Switch dark mode between 6 pm to 6 am
  # autoChangeMode: false
  autoChangeMode: 2

# Show scroll percent in scroll-to-top button
rightside_scroll_percent: true

# Don't modify the following settings unless you know how they work
# Choose: readmode, translate, darkmode, hideAside, toc, chat, comment
# Don't repeat the same value
rightside_item_order:
  enable: true
  # Default: readmode, translate, darkmode, hideAside
  hide: readmode,darkmode
  # Default: toc, chat, comment
  show: hideAside,toc,chat,comment

# Animation for the bottom right config button
rightside_config_animation: true

# --------------------------------------
# Global Settings
# --------------------------------------

anchor:
  # When you scroll, the URL will update according to header id.
  auto_update: false
  # Click the headline to scroll and update the anchor
  click_to_scroll: false

photofigcaption: false

copy:
  enable: true

# Need to install the hexo-wordcount plugin
wordcount:
  enable: true
  # Display the word count of the article in post meta
  post_wordcount: true
  # Display the time to read the article in post meta
  min2read: true
  # Display the total word count of the website in aside's webinfo
  total_wordcount: true

# Busuanzi count for PV / UV in site
busuanzi:
  site_uv: true
  site_pv: true
  page_pv: false

# --------------------------------------
# Math
# --------------------------------------

# About the per_page
# if you set it to true, it will load mathjax/katex script in each page
# if you set it to false, it will load mathjax/katex script according to your setting (add the 'mathjax: true' or 'katex: true' in page's front-matter)
math:
  # Choose: mathjax, katex
  # Leave it empty if you don't need math
  use: mathjax
  # Load MathJax automatically on every post/page.
  per_page: true
  hide_scrollbar: false

  mathjax:
    # Enable the contextual menu
    enableMenu: true
    # Choose: all / ams / none, This controls whether equations are numbered and how
    tags: none

# --------------------------------------
# Search
# --------------------------------------

search:
  # Choose: algolia_search / local_search / docsearch
  # leave it empty if you don't need search
  use: local_search
  # Local Search
  local_search:
    # Load the index when search is opened instead of fetching it on every page.
    preload: false
    # Surface more than one relevant context when an article contains several matches.
    top_n_per_article: 2
    # Unescape html strings to the readable one.
    unescape: true
    # Enable pagination for search results
    pagination:
      enable: true
      # Number of search results per page
      hitsPerPage: 8

# --------------------------------------
# Comments System
# --------------------------------------

comments:
  # Up to two comments system, the first will be shown as default
  # Leave it empty if you don't need comments
  # Twikoo stores comments in its own database; configure the endpoint below after deployment.
  # Format of two comments system : Disqus,Waline
  use: Twikoo
  # Display the comment name next to the button
  text: true
  # Lazyload: The comment system will be load when comment element enters the browser's viewport.
  # If you set it to true, the comment count will be invalid
  lazyload: false
  # Display comment count in post's top_img
  count: false
  # Display comment count in Home Page
  card_post_count: false

# Twikoo
# https://twikoo.js.org/
twikoo:
  envId: 'https://mistlane.netlify.app/.netlify/functions/twikoo'
  region: ''
  visitor: false
  option:
    lang: zh-CN
# --------------------------------------
# Beautify / Effect
# --------------------------------------

# Theme color for customize
# Notice: color value must in double quotes like "#000" or may cause error!

# theme_color:
#   enable: true
#   main: "#49B1F5"
#   paginator: "#00c4b6"
#   button_hover: "#FF7242"
#   text_selection: "#00c4b6"
#   link_color: "#99a9bf"
#   meta_color: "#858585"
#   hr_color: "#A4D8FA"
#   code_foreground: "#F47466"
#   code_background: "rgba(27, 31, 35, .05)"
#   toc_color: "#00c4b6"
#   blockquote_padding_color: "#49b1f5"
#   blockquote_background_color: "#49b1f5"
#   scrollbar_color: "#49b1f5"
#   meta_theme_color_light: "ffffff"
#   meta_theme_color_dark: "#0d0d0d"

# The user interface setting of category and tag page
# Choose: index - same as Homepage UI / default - same as archives UI
# leave it empty or index
category_ui: index
tag_ui: index

# Rounded corners for UI elements
rounded_corners_ui: true

# Stretches the lines so that each line has equal width
text_align_justify: false

# Add a mask to the header and footer
mask:
  header: true
  footer: false

# Page Transition
enter_transitions: true

# Default display mode - light (default) / dark
display_mode: light

# Global font settings
# Don't modify the following settings unless you know how they work
font:
  global_font_size: 16px
  code_font_size:
  font_family:
  code_font_family:

# Font settings for the site title and site subtitle
blog_title_font:
  font_link:
  font_family:

# The setting of divider icon
hr_icon:
  enable: true
  # The unicode value of Font Awesome icon, such as '\3423'
  icon:
  icon_top:

# --------------------------------------
# Tag Plugins settings
# --------------------------------------

# Mermaid
# https://github.com/mermaid-js/mermaid
mermaid:
  enable: false
  # Write Mermaid diagrams using code blocks
  code_write: false
  # built-in themes: default / forest / dark / neutral
  theme:
    light: default
    dark: dark
  # Enable "Open in New Tab" button to view diagram in a separate window
  open_in_new_tab: true
  # Enable zoom and pan interactions on diagrams
  zoom_pan: true

# Note - Bootstrap Callout
note:
  # Note tag style values:
  #  - simple    bs-callout old alert style. Default.
  #  - modern    bs-callout new (v2-v3) alert style.
  #  - flat      flat callout style with background, like on Mozilla or StackOverflow.
  #  - disabled  disable all CSS styles import of note tag.
  style: flat
  icons: true
  border_radius: 3
  # Offset lighter of background in % for modern and flat styles (modern: -12 | 12; flat: -18 | 6).
  # Offset also applied to label tag variables. This option can work with disabled note tag.
  light_bg_offset: 0

# --------------------------------------
# Other Settings
# --------------------------------------

# Lazyload
# https://github.com/verlok/vanilla-lazyload
lazyload:
  enable: true
  # Use browser's native lazyload instead of vanilla-lazyload
  native: true
  # Specify the field to use lazyload (site or post)
  field: site
  placeholder:
  blur: true

# Open graph meta tags
# https://hexo.io/docs/helpers#open-graph
Open_Graph_meta:
  enable: true
  option:
    twitter_card: summary_large_image
    twitter_image: /images/selection1.jpg
    # twitter_id:
    # twitter_site:
    # google_plus:
    # fb_admins:
    # fb_app_id:

# Structured Data
# https://developers.google.com/search/docs/guides/intro-structured-data
structured_data:
  enable: true
  # Alternate name for the site, used in structured data
  # Format: ['name1', 'name2']
  alternate_name: ['Mistlane', '临涧路 · 林间露']

# Add the vendor prefixes to ensure compatibility
css_prefix: true

# Inject
# Insert the code to head (before '</head>' tag) and the bottom (before '</body>' tag)
inject:
  head:
    # 个人卡片美化样式
    # 关于页面信封样式
    # 全局样式增强
    # Markdown 样式美化
    - <link rel="stylesheet" href="/css/mistlane/markdown.css">
    # 全站页面与功能页视觉统一
    # Site polish is the single source of truth for the custom visual system.
    - <link rel="stylesheet" href="/css/mistlane/site-polish.css">
    - <link rel="stylesheet" href="/css/mistlane/guestbook.css">
    # 访客所在地欢迎卡片
    - <link rel="stylesheet" href="/css/mistlane/visitor-welcome.css">
    - <link rel="stylesheet" href="/css/mistlane/comments.css">
    # 相册页面
  bottom:
    - <script defer src="/js/mistlane/petals.js"></script>
    - <script defer src="/js/mistlane/visitor-welcome.js"></script>
    - <script defer src="/js/mistlane/search-performance.js"></script>
    - <script defer src="/js/mistlane/site-stats-cache.js"></script>

# CDN Settings
# Don't modify the following settings unless you know how they work
CDN:
  # The CDN provider for internal and third-party scripts
  # Options for both: local/jsdelivr/unpkg/cdnjs/custom
  # Note: Dev version can only use 'local' for internal scripts
  # Note: When setting third-party scripts to 'local', you need to install hexo-butterfly-extjs
  internal_provider: jsdelivr
  third_party_provider: jsdelivr

  # Add version number to url, true or false
  version: true

  # Custom format
  # For example: https://cdn.staticfile.org/${cdnjs_name}/${version}/${min_cdnjs_file}
  custom_format:

  option:
    # abcjs_basic_js:
    # activate_power_mode:
    # algolia_js:
    # algolia_search:
    # artalk_css:
    # artalk_js:
    # blueimp_md5:
    # busuanzi:
    # canvas_fluttering_ribbon:
    # canvas_nest:
    # canvas_ribbon:
    # chartjs:
    # click_heart:
    # clickShowText:
    # disqusjs:
    # disqusjs_css:
    # docsearch_css:
    # docsearch_js:
    # egjs_infinitegrid:
    # fancybox:
    # fancybox_css:
    # fireworks:
    fontawesome: https://lib.baomitu.com/font-awesome/7.0.0/css/all.min.css
    # gitalk:
    # gitalk_css:
    # giscus:
    # instantpage:
    # katex:
    # katex_copytex:
    # lazyload:
    # Butterfly internal scripts: use npmmirror for mainland-friendly delivery.
    local_search: https://cdn.jsdmirror.com/npm/hexo-theme-butterfly@5.6.1/source/js/search/local-search.min.js
    main: https://cdn.jsdmirror.com/npm/hexo-theme-butterfly@5.6.1/source/js/main.min.js
    # main_css:
    # MathJax loads fonts/extensions dynamically; jsdmirror preserves its npm paths.
    mathjax: https://cdn.jsdmirror.com/npm/mathjax@4.1.3/tex-mml-chtml.js
    # medium_zoom:
    # mermaid:
    # meting_js:
    # prismjs_autoloader:
    # prismjs_js:
    # prismjs_lineNumber_js:
    # pjax:
    # sharejs:
    # sharejs_css:
    # snackbar:
    # snackbar_css:
    # translate:
    twikoo: https://cdn.jsdmirror.com/npm/twikoo@1.7.15/dist/twikoo.all.min.js
    # typed:
    utils: https://cdn.jsdmirror.com/npm/hexo-theme-butterfly@5.6.1/source/js/utils.min.js
    # valine:
    # waline_css:
    # waline_js:
