<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mistlane 管理台</title><style>
:root{--ink:#17353d;--muted:#6c8084;--line:#d9e5e4;--paper:#f6faf9;--panel:#fff;--teal:#18756f;--teal-soft:#e4f3ef;--coral:#bd685b}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.55 system-ui,-apple-system,"Microsoft YaHei",sans-serif}.shell{display:grid;grid-template-columns:230px 1fr;min-height:100vh}aside{padding:28px 18px;background:#173b42;color:#dcefee}aside h1{margin:0 0 6px;font-size:20px;color:#fff}aside p{margin:0 0 26px;color:#a9c9c9;font-size:12px}nav button{display:block;width:100%;margin:5px 0;padding:10px 12px;border:0;border-radius:5px;background:transparent;color:#c4dada;text-align:left;font:inherit;cursor:pointer}nav button:hover,nav button.active{background:#28565a;color:#fff}main{max-width:1180px;width:100%;margin:0 auto;padding:34px}.top{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:26px}.top h2{margin:0;font-size:24px}.top p{margin:3px 0 0;color:var(--muted)}button,.button{border:1px solid var(--line);border-radius:5px;background:#fff;color:var(--ink);padding:8px 11px;font:inherit;cursor:pointer}button:hover,.button:hover{border-color:var(--teal);color:var(--teal)}button.primary{border-color:var(--teal);background:var(--teal);color:#fff}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.metric,.panel{border:1px solid var(--line);border-radius:7px;background:var(--panel);box-shadow:0 5px 18px rgba(27,58,62,.05)}.metric{padding:18px}.metric strong{display:block;font-size:25px}.metric span{color:var(--muted);font-size:12px}.panel{padding:20px}.panel h3{margin:0 0 14px;font-size:16px}.hidden{display:none!important}.toolbar{display:flex;flex-wrap:wrap;gap:9px;margin-bottom:16px}.list{display:grid;gap:8px}.post{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:13px;border:1px solid var(--line);border-radius:5px}.post strong{display:block}.post small{color:var(--muted)}.actions{display:flex;gap:6px}label{display:block;margin:0 0 13px;color:var(--muted);font-size:12px;font-weight:700}input,textarea,select{display:block;width:100%;margin-top:5px;padding:9px 10px;border:1px solid var(--line);border-radius:5px;background:#fff;color:var(--ink);font:14px/1.5 ui-monospace,SFMono-Regular,Consolas,monospace}textarea{min-height:180px;resize:vertical}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.form-actions{display:flex;gap:8px;margin-top:15px}.notice{padding:12px 14px;border-left:3px solid var(--teal);background:var(--teal-soft);color:#245b58}.output{white-space:pre-wrap;max-height:300px;overflow:auto;background:#10262b;color:#d9f0ef;padding:15px;border-radius:5px;font:12px/1.6 ui-monospace,monospace}.image-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}.image{overflow:hidden;border:1px solid var(--line);border-radius:5px;background:#fff}.image img{display:block;width:100%;height:95px;object-fit:cover}.image code{display:block;padding:7px;font-size:10px;overflow-wrap:anywhere}.toast{position:fixed;right:20px;bottom:20px;z-index:10;padding:10px 14px;border-radius:5px;background:#173b42;color:#fff;opacity:0;transform:translateY(8px);transition:.2s}.toast.show{opacity:1;transform:none}@media(max-width:760px){.shell{grid-template-columns:1fr}aside{padding:18px}nav{display:flex;overflow:auto;gap:4px}nav button{width:auto;white-space:nowrap}main{padding:20px}.grid{grid-template-columns:1fr 1fr}.two{grid-template-columns:1fr}.post{align-items:flex-start;flex-direction:column}.top{align-items:flex-start;flex-direction:column}}
</style></head><body><div class="shell"><aside><h1>Mistlane</h1><p>本地博客管理台</p><nav><button data-view="dashboard" class="active">概览</button><button data-view="posts">文章管理</button><button data-view="announcement">公告栏</button><button data-view="albums">相册数据</button><button data-view="pages">页面内容</button><button data-view="media">媒体库</button><button data-view="tasks">同步与构建</button></nav></aside><main><div class="top"><div><h2 id="title">概览</h2><p id="subtitle">管理内容，不影响线上站点。</p></div><a class="button" href="http://localhost:4000/" target="_blank">打开博客</a></div><section id="view"></section></main></div><div id="toast" class="toast"></div><script>
const $=s=>document.querySelector(s),view=$('#view'),title=$('#title'),subtitle=$('#subtitle');let posts=[];const api=async(path,opt={})=>{const r=await fetch(path,{headers:{'Content-Type':'application/json'},...opt});const d=await r.json();if(!r.ok)throw Error(d.error||'操作失败');return d};const toast=m=>{const e=$('#toast');e.textContent=m;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2200)};const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const dates=v=>String(v||'').replace(' ','T').slice(0,16);
async function dashboard(){const d=await api('/api/overview');view.innerHTML=`<div class="grid"><div class="metric"><strong>${d.posts}</strong><span>篇文章</span></div><div class="metric"><strong>${d.albums}</strong><span>个相册</span></div><div class="metric"><strong>${d.photos}</strong><span>张照片</span></div><div class="metric"><strong>本地</strong><span>仅 127.0.0.1 可访问</span></div></div><div class="panel" style="margin-top:16px"><h3>当前公告</h3><p>${esc(d.announcement||'尚未填写公告')}</p></div>`}
async function showPosts(){posts=await api('/api/posts');view.innerHTML=`<div class="toolbar"><button class="primary" id="newPost">新建文章</button><button id="refreshPosts">刷新列表</button></div><div class="list">${posts.map(p=>`<div class="post"><div><strong>${esc(p.title)}</strong><small>${esc(p.date)} · ${(p.categories||[]).join('、')||'未分类'}</small></div><div class="actions"><button data-edit="${esc(p.file)}">编辑</button><button data-delete="${esc(p.file)}">删除</button></div></div>`).join('')||'<div class="notice">尚无文章。</div>'}</div>`;$('#newPost').onclick=()=>postForm();$('#refreshPosts').onclick=showPosts;view.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>loadPost(b.dataset.edit));view.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>deletePost(b.dataset.delete))}
function postForm(p={meta:{date:new Date().toISOString().slice(0,16),tags:[],categories:[]},content:''},file=''){const m=p.meta||{};view.innerHTML=`<div class="panel"><h3>${file?'编辑文章':'新建文章'}</h3><div class="two"><label>标题<input id="pTitle" value="${esc(m.title||'')}"></label><label>文件名${file?`<input value="${esc(file)}" disabled>`:`<input id="pFile" placeholder="例如：我的新文章.md">`}</label><label>发布时间<input id="pDate" type="datetime-local" value="${dates(m.date)}"></label><label>封面路径<input id="pCover" value="${esc(m.cover||'')}" placeholder="/images/uploads/example.jpg"></label><label>标签（逗号分隔）<input id="pTags" value="${esc((m.tags||[]).join(','))}"></label><label>分类（逗号分隔）<input id="pCategories" value="${esc((m.categories||[]).join(','))}"></label></div><label>摘要<input id="pDescription" value="${esc(m.description||'')}"></label><label>正文（Markdown）<textarea id="pContent">${esc(p.content||'')}</textarea></label><div class="form-actions"><button class="primary" id="savePost">保存文章</button><button id="cancelPost">返回列表</button></div></div>`;$('#cancelPost').onclick=showPosts;$('#savePost').onclick=async()=>{try{const meta={title:$('#pTitle').value.trim(),date:$('#pDate').value,tags:$('#pTags').value,categories:$('#pCategories').value,cover:$('#pCover').value.trim(),description:$('#pDescription').value.trim()};if(!meta.title)throw Error('请填写标题');const result=await api('/api/post',{method:'POST',body:JSON.stringify({file: file || undefined,fileName:file?undefined:$('#pFile').value.trim(),meta,content:$('#pContent').value})});toast('文章已保存');await loadPost(result.file)}catch(e){toast(e.message)}}}
async function loadPost(file){postForm(await api('/api/post?file='+encodeURIComponent(file)),file)}async function deletePost(file){if(!confirm(`删除 ${file}？此操作不可恢复。`))return;try{await api('/api/post',{method:'DELETE',body:JSON.stringify({file})});toast('文章已删除');showPosts()}catch(e){toast(e.message)}}
async function announcement(){const d=await api('/api/announcement');view.innerHTML=`<div class="panel"><h3>首页公告栏</h3><label>公告内容<textarea id="announcement">${esc(d.content)}</textarea></label><button class="primary" id="saveAnnouncement">保存公告</button></div>`;$('#saveAnnouncement').onclick=async()=>{try{await api('/api/announcement',{method:'PUT',body:JSON.stringify({content:$('#announcement').value})});toast('公告已保存')}catch(e){toast(e.message)}}}
async function albums(){const d=await api('/api/albums');view.innerHTML=`<div class="panel"><h3>相册数据</h3><p class="notice">可直接维护相册、照片、标题、日期、地点和图片路径。保存前会检查 JSON 格式。</p><label>data.json<textarea id="albums">${esc(JSON.stringify(d,null,2))}</textarea></label><button class="primary" id="saveAlbums">保存相册</button></div>`;$('#saveAlbums').onclick=async()=>{try{const data=JSON.parse($('#albums').value);await api('/api/albums',{method:'PUT',body:JSON.stringify(data)});toast('相册已保存')}catch(e){toast(e.message||'JSON 格式不正确')}}}
async function pages(){const pages=await api('/api/pages');view.innerHTML=`<div class="panel"><h3>独立页面</h3><div class="toolbar">${Object.entries(pages).map(([id,name])=>`<button data-page="${id}">${name}</button>`).join('')}</div><label>页面源码<textarea id="pageContent" placeholder="选择一个页面后开始编辑" disabled></textarea></label><button class="primary" id="savePage" disabled>保存页面</button></div>`;view.querySelectorAll('[data-page]').forEach(b=>b.onclick=async()=>{const d=await api('/api/page?id='+b.dataset.page);$('#pageContent').disabled=false;$('#pageContent').value=d.content;$('#savePage').disabled=false;$('#savePage').onclick=async()=>{try{await api('/api/page',{method:'PUT',body:JSON.stringify({id:b.dataset.page,content:$('#pageContent').value})});toast('页面已保存')}catch(e){toast(e.message)}}})}
async function media(){const images=await api('/api/images');view.innerHTML=`<div class="panel"><h3>媒体库</h3><div class="toolbar"><input id="upload" type="file" accept="image/*"><button class="primary" id="uploadButton">上传图片</button></div><div class="image-list">${images.map(src=>`<div class="image"><img src="${src}" loading="lazy"><code>${src}</code></div>`).join('')||'<div class="notice">暂无图片。</div>'}</div></div>`;$('#uploadButton').onclick=()=>uploadImage($('#upload').files[0])}async function uploadImage(file){try{if(!file)throw Error('请选择一张图片');const data=await new Promise((r,j)=>{const f=new FileReader();f.onload=()=>r(f.result);f.onerror=j;f.readAsDataURL(file)});const d=await api('/api/upload',{method:'POST',body:JSON.stringify({name:file.name,data})});toast('图片已上传：'+d.path);media()}catch(e){toast(e.message)}}
function tasks(){view.innerHTML=`<div class="panel"><h3>同步与构建</h3><p>追番同步会更新 Bilibili 追番数据；静态构建会生成完整站点文件。</p><div class="toolbar"><button class="primary" data-action="bangumi">刷新追番列表</button><button data-action="build">生成静态站点</button></div><pre class="output" id="output">等待操作…</pre></div>`;view.querySelectorAll('[data-action]').forEach(b=>b.onclick=async()=>{const out=$('#output');out.textContent='正在执行，请稍候…';try{const d=await api('/api/action',{method:'POST',body:JSON.stringify({name:b.dataset.action})});out.textContent=d.output||'完成';toast('操作完成')}catch(e){out.textContent=e.message;toast('操作失败')}})}
const views={dashboard,posts:showPosts,announcement,albums,pages,media,tasks};document.querySelectorAll('[data-view]').forEach(b=>b.onclick=async()=>{document.querySelectorAll('[data-view]').forEach(x=>x.classList.remove('active'));b.classList.add('active');title.textContent=b.textContent;subtitle.textContent=b.dataset.view==='dashboard'?'管理内容，不影响线上站点。':'所有修改仅写入博客源文件，需构建后发布。';try{await views[b.dataset.view]()}catch(e){view.innerHTML='<div class="notice">'+esc(e.message)+'</div>'}});dashboard();
</script></body></html>
